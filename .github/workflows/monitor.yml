
name: ReqRes API Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor API Availability and Performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Newman and HTML Extra Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Create Monitor Collection
        shell: bash
        run: |
          cat > monitor-collection.json <<'JSON'
          {
            "info": {
              "name": "ReqRes API Monitor",
              "description": "Monitor API availability and response time",
              "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
            },
            "item": [
              {
                "name": "GET Users - API Availability",
                "event": [
                  {
                    "listen": "test",
                    "script": {
                      "type": "text/javascript",
                      "exec": [
                        "pm.test('Status code is 200', function () {",
                        "    pm.response.to.have.status(200);",
                        "});",
                        "pm.test('Response time is below 800ms', function () {",
                        "    pm.expect(pm.response.responseTime).to.be.below(800);",
                        "});"
                      ]
                    }
                  }
                ],
                "request": {
                  "method": "GET",
                  "header": [
                    {
                      "key": "x-api-key",
                      "value": "{{api-key}}"
                    }
                  ],
                  "url": {
                    "raw": "{{baseUrl}}/api/users?page=1",
                    "host": ["{{baseUrl}}"],
                    "path": ["api", "users"],
                    "query": [
                      {
                        "key": "page",
                        "value": "1"
                      }
                    ]
                  }
                }
              }
            ]
          }
          JSON

      - name: Run Monitor and Generate HTML Report
        env:
          API_KEY: ${{ secrets.REQRES_API_KEY }}
        shell: bash
        run: |
          set -uo pipefail

          API_KEY="$(printf '%s' "${API_KEY:-}" | tr -d '\r\n')"

          if [ -z "$API_KEY" ]; then
            echo "ERROR: GitHub Secret REQRES_API_KEY is missing."
            exit 1
          fi

          set +e
          newman run monitor-collection.json \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "api-key=$API_KEY" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export monitor-report.html \
            --reporter-htmlextra-title "ReqRes API Monitor"

          TEST_EXIT_CODE=$?
          set -e

          if [ ! -s monitor-report.html ]; then
            echo "ERROR: HTML report was not generated."
            exit 1
          fi

          exit "$TEST_EXIT_CODE"

      - name: Upload HTML Monitor Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReqRes-Monitor-Report
          path: monitor-report.html
          if-no-files-found: warn
          retention-days: 7
