
name: ReqRes API Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check API availability and performance
        shell: bash
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${REQRES_API_KEY:-}" ]]; then
            echo "ERROR: Missing REQRES_API_KEY secret"
            exit 1
          fi

          result=$(curl --silent --show-error \
            --output response.json \
            --write-out '%{http_code} %{time_total}' \
            --header "x-api-key: ${REQRES_API_KEY}" \
            "https://reqres.in/api/users?page=1")

          status="${result%% *}"
          response_time="${result#* }"

          echo "HTTP status: $status"
          echo "Response time: ${response_time}s"

          if [[ "$status" != "200" ]]; then
            echo "FAIL: Expected HTTP 200"
            cat response.json
            exit 1
          fi

          awk -v t="$response_time" \
            'BEGIN { exit !(t < 0.8) }' || {
              echo "FAIL: Response time must be below 800ms"
              exit 1
            }

          echo "PASS: API returned HTTP 200 in under 800ms"
