```yaml
name: ReqRes API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor API Availability and Performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Create monitoring collection
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const key = (process.env.REQRES_API_KEY || "").trim();

          if (!key) {
            console.error("Missing REQRES_API_KEY secret");
            process.exit(1);
          }

          const collection = {
            info: {
              name: "ReqRes API Monitor",
              schema: "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
            },
            item: [{
              name: "Monitor API Availability and Performance",
              request: {
                method: "GET",
                header: [{
                  key: "x-api-key",
                  value: key
                }],
                url: "https://reqres.in/api/users?page=1"
              },
              event: [{
                listen: "test",
                script: {
                  type: "text/javascript",
                  exec: [
                    "pm.test(\\"Availability: status code is 200\\", function () {",
                    "  pm.response.to.have.status(200);",
                    "});",
                    "pm.test(\\"Performance: response time is below 800ms\\", function () {",
                    "  pm.expect(pm.response.responseTime).to.be.below(800);",
                    "});"
                  ]
                }
              }]
            }]
          };

          fs.writeFileSync(
            "monitor-collection.json",
            JSON.stringify(collection, null, 2)
          );
          '

      - name: Run API monitoring
        run: newman run monitor-collection.json --reporters cli
```
