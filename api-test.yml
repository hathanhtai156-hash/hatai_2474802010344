name: API Tests

on:
  push:
    branches:
      - main

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run data-driven API tests
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          # Replace the placeholder with the GitHub Secret at runtime.
          node -e "const fs=require('fs'); const p='ReqRes_Environment.json'; let e=JSON.parse(fs.readFileSync(p,'utf8')); e.values=e.values.map(v=>v.key==='api-key'?{...v,value:process.env.REQRES_API_KEY||''}:v); fs.writeFileSync(p,JSON.stringify(e,null,2));"
          newman run ReqRes_Collection.json \
            -e ReqRes_Environment.json \
            -d users.csv \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: report.html
          if-no-files-found: warn
